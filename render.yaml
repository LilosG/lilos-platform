previews:
  generation: off

envVarGroups:
  - name: lilos-production-runtime
    envVars:
      - key: LILOS_ENV
        value: production
      - key: LILOS_LOG_LEVEL
        value: INFO
      - key: LILOS_API_VERSION
        value: 0.1.0
      - key: LILOS_TRACE_SAMPLE_RATE
        value: 0.1
      - key: LILOS_DATABASE_CONNECT_TIMEOUT_SECONDS
        value: 5
      - key: LILOS_INTERNAL_ADMIN_ROUTES_ENABLED
        value: "false"
      - key: LILOS_PROVIDER_WRITES_ENABLED
        value: "true"
      - key: LILOS_GITHUB_APP_SLUG
        value: lilos-growth-operations
      - key: LILOS_AI_PROVIDER
        value: hermes
      - key: UV_CACHE_DIR
        value: /tmp/uv-cache
      - key: LILOS_SUPABASE_AUTH_AUDIENCE
        value: authenticated
      - key: LILOS_SUPABASE_AUTH_ALLOWED_ALGORITHMS
        value: ES256,RS256

services:
  - name: lilos-hermes
    type: pserv
    runtime: docker
    region: oregon
    plan: standard
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/hermes-render.Dockerfile
    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8642"
      - key: API_SERVER_ENABLED
        value: "true"
      - key: API_SERVER_HOST
        value: 0.0.0.0
      - key: API_SERVER_PORT
        value: "8642"
      - key: API_SERVER_KEY
        generateValue: true
      - key: API_SERVER_MODEL_NAME
        value: hermes-agent
      - key: HERMES_RUNTIME_VERSION
        value: v2026.8.19
      - key: HERMES_INFERENCE_PROVIDER
        value: openrouter
      - key: HERMES_INFERENCE_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: HERMES_MAX_ITERATIONS
        value: "60"
      - key: HERMES_YOLO_MODE
        value: "0"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LILOS_TOOL_BASE_URL
        fromService:
          name: lilos-api
          type: web
          property: hostport
      - key: LILOS_TOOL_API_KEY
        generateValue: true

  - name: lilos-api
    type: web
    runtime: docker
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerCommand: sh /app/scripts/render_start_api.sh
    preDeployCommand: sh /app/scripts/render_predeploy.sh
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    numInstances: 1
    envVars:
      - fromGroup: lilos-production-runtime
      - key: LILOS_DATABASE_URL
        sync: false
      - key: LILOS_MIGRATION_DATABASE_URL
        sync: false
      - key: LILOS_SUPABASE_AUTH_ISSUER
        sync: false
      - key: LILOS_SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: LILOS_TELEMETRY_EXPORT_ENDPOINT
        sync: false
      - key: LILOS_WEB_ORIGINS
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: LILOS_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: LILOS_GOOGLE_PAGESPEED_API_KEY
        sync: false
      - key: LILOS_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LILOS_DATAFORSEO_LOGIN
        sync: false
      - key: LILOS_DATAFORSEO_PASSWORD
        sync: false
      - key: LILOS_SECRET_ENCRYPTION_KEY
        sync: false
      - key: LILOS_GITHUB_APP_ID
        sync: false
      - key: LILOS_GITHUB_APP_CLIENT_ID
        sync: false
      - key: LILOS_GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: LILOS_GITHUB_APP_INSTALLATION_REDIRECT_URI
        sync: false
      - key: LILOS_OPENROUTER_API_KEY
        sync: false
      - key: LILOS_HERMES_BASE_URL
        fromService:
          name: lilos-hermes
          type: pserv
          property: hostport
      - key: LILOS_HERMES_API_KEY
        fromService:
          name: lilos-hermes
          type: pserv
          envVarKey: API_SERVER_KEY
      - key: LILOS_HERMES_TOOL_API_KEY
        fromService:
          name: lilos-hermes
          type: pserv
          envVarKey: LILOS_TOOL_API_KEY
      - key: LILOS_HERMES_RUNTIME_RELEASE
        fromService:
          name: lilos-hermes
          type: pserv
          envVarKey: HERMES_RUNTIME_VERSION

  - name: lilos-worker
    type: worker
    runtime: docker
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerCommand: sh /app/scripts/render_start_worker.sh
    maxShutdownDelaySeconds: 300
    numInstances: 1
    envVars:
      - fromGroup: lilos-production-runtime
      - key: LILOS_DATABASE_URL
        sync: false
      - key: LILOS_SUPABASE_AUTH_ISSUER
        sync: false
      - key: LILOS_SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: LILOS_TELEMETRY_EXPORT_ENDPOINT
        sync: false
      - key: LILOS_SECRET_ENCRYPTION_KEY
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: LILOS_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: LILOS_GOOGLE_PAGESPEED_API_KEY
        sync: false
      - key: LILOS_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LILOS_DATAFORSEO_LOGIN
        sync: false
      - key: LILOS_DATAFORSEO_PASSWORD
        sync: false
      - key: LILOS_GITHUB_APP_ID
        sync: false
      - key: LILOS_GITHUB_APP_CLIENT_ID
        sync: false
      - key: LILOS_GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: LILOS_GITHUB_APP_INSTALLATION_REDIRECT_URI
        sync: false
      - key: LILOS_OPENROUTER_API_KEY
        sync: false
      - key: LILOS_HERMES_BASE_URL
        fromService:
          name: lilos-hermes
          type: pserv
          property: hostport
      - key: LILOS_HERMES_API_KEY
        fromService:
          name: lilos-hermes
          type: pserv
          envVarKey: API_SERVER_KEY
      - key: LILOS_HERMES_RUNTIME_RELEASE
        fromService:
          name: lilos-hermes
          type: pserv
          envVarKey: HERMES_RUNTIME_VERSION

  - name: lilos-scheduler
    type: worker
    runtime: docker
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerCommand: sh /app/scripts/render_start_scheduler.sh
    maxShutdownDelaySeconds: 60
    numInstances: 1
    envVars:
      - fromGroup: lilos-production-runtime
      - key: LILOS_DATABASE_URL
        sync: false
      - key: LILOS_SUPABASE_AUTH_ISSUER
        sync: false
      - key: LILOS_SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: LILOS_TELEMETRY_EXPORT_ENDPOINT
        sync: false
      - key: LILOS_SECRET_ENCRYPTION_KEY
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: LILOS_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: LILOS_GITHUB_APP_ID
        sync: false
      - key: LILOS_GITHUB_APP_CLIENT_ID
        sync: false
      - key: LILOS_GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: LILOS_GITHUB_APP_INSTALLATION_REDIRECT_URI
        sync: false
      - key: LILOS_OPENROUTER_API_KEY
        sync: false
