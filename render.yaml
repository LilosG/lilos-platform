previews:
  generation: off

envVarGroups:
  - name: lilos-production-runtime
    envVars:
      - key: LILOS_ENV
        value: production
      - key: LILOS_LOG_LEVEL
        value: INFO
      - key: LILOS_API_VERSION
        value: 0.1.0
      - key: LILOS_TRACE_SAMPLE_RATE
        value: 0.1
      - key: LILOS_DATABASE_CONNECT_TIMEOUT_SECONDS
        value: 5
      - key: LILOS_INTERNAL_ADMIN_ROUTES_ENABLED
        value: "false"
      - key: LILOS_PROVIDER_WRITES_ENABLED
        value: "false"
      - key: UV_CACHE_DIR
        value: /tmp/uv-cache
      - key: LILOS_SUPABASE_AUTH_AUDIENCE
        value: authenticated
      - key: LILOS_SUPABASE_AUTH_ALLOWED_ALGORITHMS
        value: ES256,RS256

services:
  - name: lilos-api
    type: web
    runtime: docker
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerCommand: sh /app/scripts/render_start_api.sh
    preDeployCommand: sh /app/scripts/render_predeploy.sh
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    numInstances: 1
    envVars:
      - fromGroup: lilos-production-runtime
      - key: LILOS_DATABASE_URL
        sync: false
      - key: LILOS_MIGRATION_DATABASE_URL
        sync: false
      - key: LILOS_SUPABASE_AUTH_ISSUER
        sync: false
      - key: LILOS_SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: LILOS_TELEMETRY_EXPORT_ENDPOINT
        sync: false
      - key: LILOS_WEB_ORIGINS
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: LILOS_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: LILOS_GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: LILOS_SECRET_ENCRYPTION_KEY
        sync: false
      - key: LILOS_GITHUB_APP_ID
        sync: false
      - key: LILOS_GITHUB_APP_CLIENT_ID
        sync: false
      - key: LILOS_GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: LILOS_GITHUB_APP_INSTALLATION_REDIRECT_URI
        sync: false

  - name: lilos-worker
    type: worker
    runtime: docker
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerCommand: sh /app/scripts/render_start_worker.sh
    maxShutdownDelaySeconds: 300
    numInstances: 1
    envVars:
      - fromGroup: lilos-production-runtime
      - key: LILOS_DATABASE_URL
        sync: false
      - key: LILOS_SUPABASE_AUTH_ISSUER
        sync: false
      - key: LILOS_SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: LILOS_TELEMETRY_EXPORT_ENDPOINT
        sync: false

  - name: lilos-scheduler
    type: worker
    runtime: docker
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerCommand: sh /app/scripts/render_start_scheduler.sh
    maxShutdownDelaySeconds: 60
    numInstances: 1
    envVars:
      - fromGroup: lilos-production-runtime
      - key: LILOS_DATABASE_URL
        sync: false
      - key: LILOS_SUPABASE_AUTH_ISSUER
        sync: false
      - key: LILOS_SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: LILOS_TELEMETRY_EXPORT_ENDPOINT
        sync: false
