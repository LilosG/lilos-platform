name: Remediate Growth PR 78

on:
  push:
    branches:
      - ci/remediate-growth-78

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Growth branch
        uses: actions/checkout@v7
        with:
          ref: feat/growth-orchestration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply Growth catalog and handler corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected target missing in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/api/app/execution/operational_extensions.py',
              '    "agent.gbp",\n    "agent.seo",',
              '    "agent.gbp",\n    "agent.growth",\n    "agent.seo",',
          )
          replace_once(
              'tests/python/administration/test_contracts.py',
              '        "gbp",\n        "reviews",',
              '        "gbp",\n        "growth",\n        "reviews",',
          )
          replace_once(
              'tests/python/administration/test_domain.py',
              '== (7, 7)',
              '== (8, 8)',
          )
          replace_once(
              'tests/python/audit/test_migration.py',
              '            "gbp_suspension_cases",\n            "incident_timeline_entries",',
              '            "gbp_suspension_cases",\n'
              '            "growth_actions",\n'
              '            "growth_initiatives",\n'
              '            "growth_outcomes",\n'
              '            "incident_timeline_entries",',
          )
          replace_once(
              'tests/python/database/test_migrations.py',
              '        "gbp_suspension_cases",\n        "incident_timeline_entries",',
              '        "gbp_suspension_cases",\n'
              '        "growth_actions",\n'
              '        "growth_initiatives",\n'
              '        "growth_outcomes",\n'
              '        "incident_timeline_entries",',
          )
          replace_once(
              'tests/python/workflows/test_automation_product.py',
              '        "agent.gbp",\n        "agent.insights",',
              '        "agent.gbp",\n        "agent.growth",\n        "agent.insights",',
          )
          replace_once(
              'tests/python/workflows/test_automation_product.py',
              '            "agent.gbp",\n            "agent.insights",',
              '            "agent.gbp",\n            "agent.growth",\n            "agent.insights",',
          )
          replace_once(
              'tests/python/workflows/test_automation_product.py',
              '    assert count == 17\n',
              '    assert count == 18\n',
          )
          replace_once(
              'tests/python/workflows/test_automation_unit.py',
              '        "agent.gbp",\n        "agent.insights",',
              '        "agent.gbp",\n        "agent.growth",\n        "agent.insights",',
          )
          PY
          uv run ruff format apps tests scripts migrations
          uv run ruff check --fix \
            apps/api/app/execution/operational_extensions.py \
            tests/python/administration/test_contracts.py \
            tests/python/administration/test_domain.py \
            tests/python/audit/test_migration.py \
            tests/python/database/test_migrations.py \
            tests/python/workflows/test_automation_product.py \
            tests/python/workflows/test_automation_unit.py
          uv run ruff format apps tests scripts migrations

      - name: Verify static gates
        run: |
          uv run ruff format --check apps tests scripts migrations
          uv run ruff check apps tests scripts migrations
          uv run mypy apps tests scripts migrations

      - name: Verify non-database Growth catalog regressions
        run: >-
          uv run pytest -q
          tests/python/administration/test_contracts.py::test_product_and_configuration_catalogs_are_exact
          tests/python/workflows/test_automation_unit.py::test_canonical_workflow_types_registered
          tests/python/workflows/test_workflow_handlers.py::test_all_catalog_workflow_keys_have_registered_handlers

      - name: Reject unexpected changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(apps/api/app/execution/operational_extensions\.py|tests/python/administration/test_contracts\.py|tests/python/administration/test_domain\.py|tests/python/audit/test_migration\.py|tests/python/database/test_migrations\.py|tests/python/workflows/test_automation_product\.py|tests/python/workflows/test_automation_unit\.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/app/execution/operational_extensions.py \
            tests/python/administration/test_contracts.py \
            tests/python/administration/test_domain.py \
            tests/python/audit/test_migration.py \
            tests/python/database/test_migrations.py \
            tests/python/workflows/test_automation_product.py \
            tests/python/workflows/test_automation_unit.py
          git diff --cached --check
          git commit -m 'Register Growth workflow and update canonical test catalogs'
          git push origin HEAD:feat/growth-orchestration
