name: Remediate Growth PR 78

on:
  push:
    branches:
      - ci/remediate-growth-78

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Growth branch
        uses: actions/checkout@v7
        with:
          ref: feat/growth-orchestration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Apply deterministic lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          handler = Path('apps/api/app/agents/execution_handler.py')
          text = handler.read_text()
          text = text.replace('from functools import lru_cache', 'from functools import cache')
          text = text.replace('@lru_cache(maxsize=None)', '@cache')
          handler.write_text(text)

          tools = Path('apps/api/app/agents/tools.py')
          text = tools.read_text()
          old = '                    f"Growth action {action.action_key} cites evidence absent from plan source_references"\n'
          new = (
              '                    "Growth action "\n'
              '                    f"{action.action_key} cites evidence absent from "\n'
              '                    "plan source_references"\n'
          )
          if old not in text:
              raise SystemExit('Expected Growth evidence lint target was not found')
          tools.write_text(text.replace(old, new, 1))

          migration = Path('migrations/versions/20260910_0001_growth_orchestration.py')
          text = migration.read_text()
          old = '            "status IN (\'proposed\',\'approved\',\'queued\',\'running\',\'waiting_approval\',\'completed\',\'failed\',\'skipped\',\'cancelled\')",\n'
          new = (
              '            "status IN (\'proposed\',\'approved\',\'queued\',\'running\',"\n'
              '            "\'waiting_approval\',\'completed\',\'failed\',\'skipped\',\'cancelled\')",\n'
          )
          if old not in text:
              raise SystemExit('Expected Growth status lint target was not found')
          migration.write_text(text.replace(old, new, 1))
          PY
          uv run ruff check --fix tests/python/growth/test_growth_contracts.py
          uv run ruff format apps tests scripts migrations

      - name: Verify Python formatting and lint
        run: |
          uv run ruff format --check apps tests scripts migrations
          uv run ruff check apps tests scripts migrations

      - name: Reject unexpected file changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(apps/api/app/agents/execution_handler\.py|apps/api/app/agents/tools\.py|migrations/versions/20260910_0001_growth_orchestration\.py|tests/python/growth/test_growth_contracts\.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected remediation changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified lint remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/app/agents/execution_handler.py \
                  apps/api/app/agents/tools.py \
                  migrations/versions/20260910_0001_growth_orchestration.py \
                  tests/python/growth/test_growth_contracts.py
          git diff --cached --check
          git commit -m 'Fix Growth orchestration Python lint violations'
          git push origin HEAD:feat/growth-orchestration
