name: Remediate Growth PR 78

on:
  push:
    branches:
      - ci/remediate-growth-78

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Growth branch
        uses: actions/checkout@v7
        with:
          ref: feat/growth-orchestration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Apply deterministic mypy corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/api/app/growth/service.py')
          text = service.read_text()
          if 'import builtins\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nimport builtins\n',
                  1,
              )
          if 'from typing import cast\n' not in text:
              text = text.replace('from decimal import Decimal\n', 'from decimal import Decimal\nfrom typing import cast\n', 1)
          text = text.replace(') -> list[GrowthInitiative]:', ') -> builtins.list[GrowthInitiative]:')
          text = text.replace(') -> list[GrowthAction]:', ') -> builtins.list[GrowthAction]:')
          text = text.replace('dispatched: list[GrowthAction] = []', 'dispatched: builtins.list[GrowthAction] = []')
          old = '        return await session.scalar(statement)\n\n    async def list('
          new = (
              '        return cast(GrowthInitiative | None, await session.scalar(statement))\n\n'
              '    async def list('
          )
          if old not in text:
              raise SystemExit('Expected Growth get() return target was not found')
          service.write_text(text.replace(old, new, 1))

          resolver_test = Path('tests/python/execution/test_agent_workflow_resolver.py')
          text = resolver_test.read_text()
          old = '        assert handler.__name__ == f"handle_{workflow_key.replace(\'.\', \'_\')}"\n'
          new = (
              '        assert getattr(handler, "__name__", None) == '
              'f"handle_{workflow_key.replace(\'.\', \'_\')}"\n'
          )
          if old not in text:
              raise SystemExit('Expected handler name assertion target was not found')
          resolver_test.write_text(text.replace(old, new, 1))
          PY
          uv run ruff format apps tests scripts migrations
          uv run ruff check --fix apps/api/app/growth/service.py tests/python/execution/test_agent_workflow_resolver.py
          uv run ruff format apps tests scripts migrations

      - name: Verify Python formatting and lint
        run: |
          uv run ruff format --check apps tests scripts migrations
          uv run ruff check apps tests scripts migrations

      - name: Verify Python typecheck
        run: uv run mypy apps tests scripts migrations

      - name: Reject unexpected file changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(apps/api/app/growth/service\.py|tests/python/execution/test_agent_workflow_resolver\.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected remediation changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified mypy remediation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/app/growth/service.py tests/python/execution/test_agent_workflow_resolver.py
          git diff --cached --check
          git commit -m 'Fix Growth orchestration Python type errors'
          git push origin HEAD:feat/growth-orchestration
