name: Remediate Growth PR 78

on:
  push:
    branches:
      - ci/remediate-growth-78

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Growth branch
        uses: actions/checkout@v7
        with:
          ref: feat/growth-orchestration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Apply canonical Python formatting
        run: uv run ruff format apps tests scripts migrations

      - name: Verify Python formatting
        run: uv run ruff format --check apps tests scripts migrations

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Resolve patched supported dependency versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          astro_version="$(npm view 'astro@7' version --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s); process.stdout.write(String(Array.isArray(v)?v.at(-1):v));})')"
          vitest_version="$(npm view 'vitest@4' version --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s); process.stdout.write(String(Array.isArray(v)?v.at(-1):v));})')"
          node - "$astro_version" "$vitest_version" <<'NODE'
          const [astro, vitest] = process.argv.slice(2);
          const tuple = (v) => v.replace(/^v/, '').split('.').map(Number);
          const greaterThan = (left, right) => {
            const a = tuple(left), b = tuple(right);
            for (let i = 0; i < Math.max(a.length, b.length); i++) {
              const av = a[i] || 0, bv = b[i] || 0;
              if (av !== bv) return av > bv;
            }
            return false;
          };
          if (!astro.startsWith('7.') || !greaterThan(astro, '7.2.7')) {
            throw new Error(`No patched Astro 7 release resolved: ${astro}`);
          }
          if (!vitest.startsWith('4.')) {
            throw new Error(`No supported Vitest 4 release resolved: ${vitest}`);
          }
          console.log(`Resolved Astro ${astro} and Vitest ${vitest}`);
          NODE
          echo "astro=$astro_version" >> "$GITHUB_OUTPUT"
          echo "vitest=$vitest_version" >> "$GITHUB_OUTPUT"

      - name: Update manifests to patched supported ranges
        env:
          ASTRO_VERSION: ${{ steps.versions.outputs.astro }}
          VITEST_VERSION: ${{ steps.versions.outputs.vitest }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.dependencies.astro = `^${process.env.ASTRO_VERSION}`;
          manifest.devDependencies.vitest = `^${process.env.VITEST_VERSION}`;
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Regenerate dependency lock from manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules apps/web/node_modules packages/*/node_modules
          npm install --package-lock-only --ignore-scripts

      - name: Verify reproducible frontend install
        run: npm ci

      - name: Verify high/critical dependency audit is clean
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high

      - name: Reject unexpected file changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(apps/api/app/agents/hermes_client\.py|apps/api/app/agents/tools\.py|apps/api/app/growth/service\.py|migrations/versions/20260910_0001_growth_orchestration\.py|tests/python/agents/test_agent_safety_and_skills\.py|tests/python/growth/test_growth_contracts\.py|apps/web/package\.json|package-lock\.json)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected remediation changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/app/agents/hermes_client.py \
                  apps/api/app/agents/tools.py \
                  apps/api/app/growth/service.py \
                  migrations/versions/20260910_0001_growth_orchestration.py \
                  tests/python/agents/test_agent_safety_and_skills.py \
                  tests/python/growth/test_growth_contracts.py \
                  apps/web/package.json \
                  package-lock.json
          git diff --cached --check
          git commit -m 'Fix PR 78 CI formatting and dependency audit'
          git push origin HEAD:feat/growth-orchestration
