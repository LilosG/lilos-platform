name: Remediate Growth PR 78

on:
  push:
    branches:
      - ci/remediate-growth-78

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Growth branch
        uses: actions/checkout@v7
        with:
          ref: feat/growth-orchestration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Apply canonical Python formatting
        run: uv run ruff format apps tests scripts migrations

      - name: Verify Python formatting
        run: uv run ruff format --check apps tests scripts migrations

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply non-breaking dependency security fixes
        run: npm audit fix --package-lock-only

      - name: Verify reproducible frontend install
        run: npm ci

      - name: Verify high/critical dependency audit is clean
        run: npm audit --audit-level=high

      - name: Reject unexpected file changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(apps/api/app/agents/hermes_client\.py|apps/api/app/agents/tools\.py|apps/api/app/growth/service\.py|migrations/versions/20260910_0001_growth_orchestration\.py|tests/python/agents/test_agent_safety_and_skills\.py|tests/python/growth/test_growth_contracts\.py|package-lock\.json)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected remediation changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/app/agents/hermes_client.py \
                  apps/api/app/agents/tools.py \
                  apps/api/app/growth/service.py \
                  migrations/versions/20260910_0001_growth_orchestration.py \
                  tests/python/agents/test_agent_safety_and_skills.py \
                  tests/python/growth/test_growth_contracts.py \
                  package-lock.json
          git diff --cached --check
          git commit -m 'Fix PR 78 CI formatting and dependency audit'
          git push origin HEAD:feat/growth-orchestration
