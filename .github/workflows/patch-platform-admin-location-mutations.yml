name: Patch platform-admin location mutations

on:
  push:
    branches:
      - fix/platform-admin-location-mutations
    paths:
      - .github/workflows/patch-platform-admin-location-mutations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/platform-admin-location-mutations

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Add missing platform-admin location routes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/app/routes/platform_administration.py")
          text = path.read_text()

          old_import = "from apps.api.app.locations.contracts import LocationCreate, LocationData, LocationTransition"
          new_import = "from apps.api.app.locations.contracts import (\n    LocationCreate,\n    LocationData,\n    LocationTransition,\n    LocationUpdate,\n)"
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one location-contract import, found {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          marker = '''@router.post(
              "/organizations/{organization_id}/industry",
              response_model=DataResponse,
              summary="Assign the organization's industry during onboarding",
          )'''
          if text.count(marker) != 1:
              raise SystemExit(f"expected one industry-route marker, found {text.count(marker)}")

          routes = '''@router.patch(
              "/organizations/{organization_id}/locations/{location_id}",
              response_model=DataResponse,
              summary="Update a location during onboarding",
          )
          async def update_location(
              request: Request,
              organization_id: UUID,
              location_id: UUID,
              command: LocationUpdate,
              session: DatabaseSession,
          ) -> DataResponse:
              location = await locations.update(
                  session,
                  organization_id,
                  location_id,
                  command,
                  correlation_id=request_correlation_id(request),
              )
              return response(request, LocationData.model_validate(location))


          @router.post(
              "/organizations/{organization_id}/locations/{location_id}/set-primary",
              response_model=DataResponse,
              summary="Set the primary location during onboarding",
          )
          async def set_primary_location(
              request: Request,
              organization_id: UUID,
              location_id: UUID,
              command: LocationTransition,
              session: DatabaseSession,
          ) -> DataResponse:
              location = await locations.set_primary(
                  session,
                  organization_id,
                  location_id,
                  expected_version=command.expected_version,
                  correlation_id=request_correlation_id(request),
              )
              return response(request, LocationData.model_validate(location))


          @router.post(
              "/organizations/{organization_id}/locations/{location_id}/archive",
              response_model=DataResponse,
              summary="Archive a location during onboarding",
          )
          async def archive_location(
              request: Request,
              organization_id: UUID,
              location_id: UUID,
              command: LocationTransition,
              session: DatabaseSession,
          ) -> DataResponse:
              location = await locations.transition(
                  session,
                  organization_id,
                  location_id,
                  action=LocationLifecycleAction.ARCHIVE,
                  expected_version=command.expected_version,
                  correlation_id=request_correlation_id(request),
              )
              return response(request, LocationData.model_validate(location))


          '''
          text = text.replace(marker, routes + marker, 1)
          path.write_text(text)
          PY

      - name: Format and validate backend contract
        run: |
          uv sync --locked
          uv run ruff format apps/api/app/routes/platform_administration.py
          uv run ruff check apps/api/app/routes/platform_administration.py
          uv run mypy apps/api/app/routes/platform_administration.py
          uv run pytest tests/python/platform_administration/test_api.py -q

      - name: Verify routes are registered in source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("apps/api/app/routes/platform_administration.py").read_text()
          required = [
              '"/organizations/{organization_id}/locations/{location_id}"',
              '"/organizations/{organization_id}/locations/{location_id}/set-primary"',
              '"/organizations/{organization_id}/locations/{location_id}/archive"',
          ]
          missing = [route for route in required if route not in text]
          if missing:
              raise SystemExit(f"missing platform-admin location routes: {missing}")
          PY

      - name: Remove one-time patch workflow
        run: rm .github/workflows/patch-platform-admin-location-mutations.yml

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/routes/platform_administration.py .github/workflows/patch-platform-admin-location-mutations.yml
          git commit -m "Expose platform-admin location mutation routes"
          git push origin HEAD:fix/platform-admin-location-mutations
