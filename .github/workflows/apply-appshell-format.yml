name: Apply AppShell formatting

on:
  push:
    branches:
      - fix/growth-planner-run-flow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/growth-planner-run-flow
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: npx prettier --config apps/web/prettier.config.mjs --write apps/web/src/components/AppShell.astro
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/web/src/components/AppShell.astro; then
            echo "AppShell already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/AppShell.astro
          git commit -m "Apply repository Prettier output to AppShell"
          git push origin HEAD:fix/growth-planner-run-flow
