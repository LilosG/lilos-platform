name: Content closure preflight

on:
  push:
    branches:
      - release/content-workflow-closure

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lilos_test
          POSTGRES_USER: lilos_test
          POSTGRES_PASSWORD: lilos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lilos_test -d lilos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LILOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://lilos_test:lilos_test@127.0.0.1:5432/lilos_test
      LILOS_TEST_DATABASE_URL: postgresql+asyncpg://lilos_test:lilos_test@127.0.0.1:5432/lilos_test
      LILOS_RESTORE_DATABASE_URL: postgresql+asyncpg://lilos_test:lilos_test@127.0.0.1:5432/lilos_restore_test
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: release/content-workflow-closure

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      - name: Apply confirmed Content fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          web = Path('apps/web/src/pages/content.astro')
          text = web.read_text()
          text = text.replace('        type ContentOperatorTarget,\n', '', 1)
          text = text.replace(
              'resolveBusinessFact(organizationId, key, detail.location_id)',
              'resolveBusinessFact(organizationId, key, detail.location_id ?? undefined)',
              1,
          )
          web.write_text(text)

          service = Path('apps/api/app/products/content/operator_service.py')
          text = service.read_text()
          text = text.replace('from typing import Any\n', '', 1)
          old = '''        revision = await self.content.decide(\n            session,\n            organization_id,\n            item_id,\n            revision_id,\n            command,\n            actor_id=actor_id,\n            correlation_id=correlation_id,\n        )'''
          new = '''        revision = await self.content.decide(\n            session,\n            organization_id,\n            revision_id,\n            command,\n            actor_id,\n            correlation_id=correlation_id,\n        )'''
          if old not in text:
              raise SystemExit('Expected ContentService.decide call not found')
          text = text.replace(old, new, 1)
          old = '''        return await session.scalar(\n            select(ContentRevision)\n            .where(\n                ContentRevision.organization_id == organization_id,\n                ContentRevision.content_item_id == item.id,\n                ContentRevision.status == "approved",\n            )\n            .order_by(ContentRevision.revision_number.desc())\n            .limit(1)\n        )'''
          new = '''        fallback_revision: ContentRevision | None = await session.scalar(\n            select(ContentRevision)\n            .where(\n                ContentRevision.organization_id == organization_id,\n                ContentRevision.content_item_id == item.id,\n                ContentRevision.status == "approved",\n            )\n            .order_by(ContentRevision.revision_number.desc())\n            .limit(1)\n        )\n        return fallback_revision'''
          if old not in text:
              raise SystemExit('Expected approved-revision scalar return not found')
          service.write_text(text.replace(old, new, 1))

          adapter_test = Path('tests/python/content/test_github_adapter.py')
          text = adapter_test.read_text()
          text = text.replace(
              '*, expected_status: int = 200, **kwargs: Any',
              '*, expected_status: int | tuple[int, ...] = 200, **kwargs: Any',
          )
          text = text.replace(
              '            [{"id": 100, "state": "success"}],\n        ],',
              '            [{"id": 100, "state": "success"}],\n            [{"state": "success", "target_url": "0"}],\n        ],',
              1,
          )
          adapter_test.write_text(text)

          workflow_test = Path('tests/python/content/test_content_operator_workflow.py')
          text = workflow_test.read_text()
          text = text.replace(
              'summary["next_action"]["key"]',
              'cast(dict[str, str], summary["next_action"])["key"]',
          )
          workflow_test.write_text(text)
          PY

      - name: Format modified files
        run: |
          npm exec --workspace @lilos/web -- prettier --write src/pages/content.astro
          uv run ruff format apps/api/app/products/content/operator_service.py tests/python/content/test_github_adapter.py tests/python/content/test_content_operator_workflow.py

      - name: Validate formatting
        run: |
          npm run format:check:web
          uv run ruff format --check apps tests scripts migrations

      - name: Validate lint
        run: |
          npm run lint:web
          uv run ruff check apps tests scripts migrations

      - name: Validate types
        run: |
          npm run typecheck:web
          uv run mypy apps tests scripts migrations

      - name: Validate tests
        run: |
          npm run test:web
          uv run pytest

      - name: Validate frontend build
        run: npm run build:web

      - name: Commit only fully validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/content.astro apps/api/app/products/content/operator_service.py tests/python/content/test_github_adapter.py tests/python/content/test_content_operator_workflow.py
          git diff --cached --quiet && { echo 'No Content fixes to commit'; exit 1; }
          git commit -m 'Fix Content closure validation errors'
          git push origin HEAD:release/content-workflow-closure
