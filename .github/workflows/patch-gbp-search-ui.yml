name: Patch GBP search UI

on:
  push:
    branches:
      - fix/gbp-search-only-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/gbp-search-only-ui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make unmapped Business Profiles search-only
        env:
          REPLACEMENT_B64: ""
        run: |
          python -c 'import base64, os; from pathlib import Path; p=Path("apps/web/src/pages/integrations.astro"); t=p.read_text(); s=t.index("      async function renderUnmappedQueue("); e=t.index("      // -- GitHub workspace", s); r=base64.b64decode(os.environ["REPLACEMENT_B64"]).decode(); p.write_text(t[:s]+r+t[e:])'
          npx prettier --write apps/web/src/pages/integrations.astro
      - name: Commit patch
        run: |
          rm .github/workflows/patch-gbp-search-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/integrations.astro .github/workflows/patch-gbp-search-ui.yml
          git commit -m "Make GBP replacement search explicit"
          git push origin HEAD:fix/gbp-search-only-ui
