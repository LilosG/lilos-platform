name: Patch GBP removal read models

on:
  push:
    branches:
      - fix/gbp-remove-from-client
    paths:
      - .github/workflows/patch-gbp-remove-from-client.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/gbp-remove-from-client

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      - name: Patch durable GBP removal surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after_in_function(path: str, function_marker: str, target: str, insertion: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              start = text.find(function_marker)
              if start < 0:
                  raise SystemExit(f"missing function marker in {path}: {function_marker}")
              next_function = text.find("\n    async def ", start + len(function_marker))
              if next_function < 0:
                  next_function = len(text)
              section = text[start:next_function]
              if insertion.strip() in section:
                  return
              if section.count(target) != 1:
                  raise SystemExit(
                      f"expected one target in {path} {function_marker}, found {section.count(target)}"
                  )
              section = section.replace(target, target + insertion, 1)
              file_path.write_text(text[:start] + section + text[next_function:])

          insert_after_in_function(
              "apps/api/app/routes/integrations.py",
              "async def google_unmapped(",
              "                    GBPLocation.connection_id == connection.id,\n",
              '                    GBPLocation.mapping_status != "archived",\n',
          )
          insert_after_in_function(
              "apps/api/app/integrations/directory_service.py",
              "    async def _unmapped_count(",
              "                    GBPLocation.connection_id == connection_id,\n",
              '                    GBPLocation.mapping_status != "archived",\n',
          )

          integrations_page = Path("apps/web/src/pages/integrations.astro")
          text = integrations_page.read_text()
          if text.count('removeButton.textContent = "Remove mapping";') != 1:
              raise SystemExit("expected exactly one Remove mapping button label")
          text = text.replace(
              'removeButton.textContent = "Remove mapping";',
              'removeButton.textContent = "Remove from client";',
              1,
          )
          marker = 'removeButton.addEventListener("click", () => {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("missing Remove mapping click handler")
          end = text.find("            actions.append(removeButton);", start)
          if end < 0:
              raise SystemExit("missing Remove mapping action boundary")
          section = text[start:end]
          if section.count('"Remove mapping",') != 1:
              raise SystemExit("expected exactly one Remove mapping confirmation label")
          section = section.replace('"Remove mapping",', '"Remove from client",', 1)
          integrations_page.write_text(text[:start] + section + text[end:])

          gbp_page = Path("apps/web/src/pages/gbp.astro")
          text = gbp_page.read_text()
          import_old = '''      import {
        fetchGBPLocations,
        workspaceContextFor,
        type GBPLocationSummary,
      } from "../lib/gbp";'''
          import_new = '''      import {
        archiveLocationMapping,
        fetchGBPLocations,
        workspaceContextFor,
        type GBPLocationSummary,
      } from "../lib/gbp";'''
          if import_old not in text:
              raise SystemExit("GBP import block changed unexpectedly")
          text = text.replace(import_old, import_new, 1)

          render_old = '''                render: ({ location }) =>
                  locationOpenButton(location, connectionReady),'''
          render_new = '''                render: ({ location }) =>
                  locationActionButtons(location, connectionReady),'''
          if render_old not in text:
              raise SystemExit("GBP location action renderer changed unexpectedly")
          text = text.replace(render_old, render_new, 1)

          function_old = '''      function locationOpenButton(
        location: GBPLocationSummary,
        connectionReady: boolean,
      ): HTMLButtonElement {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "ui-button ui-button--primary ui-button--sm";
        button.textContent = "Open";
        button.disabled = !connectionReady || !workspaceContextFor(location);
        button.addEventListener("click", () => void openWorkspace(location));
        return button;
      }
'''
          function_new = '''      function locationActionButtons(
        location: GBPLocationSummary,
        connectionReady: boolean,
      ): HTMLDivElement {
        const actions = document.createElement("div");
        actions.className = "ui-inline";
        const context = workspaceContextFor(location);

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = "ui-button ui-button--primary ui-button--sm";
        openButton.textContent = "Open";
        openButton.disabled = !connectionReady || !context;
        openButton.addEventListener("click", () => void openWorkspace(location));
        actions.append(openButton);

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "ui-button ui-button--secondary ui-button--sm";
        removeButton.textContent = "Remove from client";
        removeButton.disabled = !connectionReady || !context;
        removeButton.addEventListener("click", async () => {
          if (!context) return;
          const confirmed = window.confirm(
            `Remove ${location.business_name} from this LILOs client? Provider writes will be disabled and the profile will no longer appear in the managed Business Profile workspace. Nothing will be deleted or changed in Google.`,
          );
          if (!confirmed) return;

          removeButton.disabled = true;
          removeButton.textContent = "Removing…";
          const result = await archiveLocationMapping(
            organizationId,
            context.platformLocationId,
            context.gbpLocationId,
          );
          if (result.kind !== "ok") {
            removeButton.disabled = false;
            removeButton.textContent = "Remove from client";
            const panel = document.getElementById("location-picker-panel")!;
            panel.prepend(errorAlert(describeFailure(result, "Remove Business Profile")));
            return;
          }

          const refreshed = await fetchGBPLocations(organizationId);
          if (refreshed.kind === "ok") {
            await renderLocationPicker(refreshed.data, googleConnectionReady);
            return;
          }
          const panel = document.getElementById("location-picker-panel")!;
          panel.prepend(
            errorAlert(describeFailure(refreshed, "Refresh Business Profile locations")),
          );
        });
        actions.append(removeButton);
        return actions;
      }
'''
          if text.count(function_old) != 1:
              raise SystemExit(f"expected one locationOpenButton function, found {text.count(function_old)}")
          gbp_page.write_text(text.replace(function_old, function_new, 1))
          PY

      - name: Apply repository formatters
        run: |
          npm run format:web
          uv run ruff format apps/api/app/routes/gbp_mapping.py apps/api/app/routes/integrations.py apps/api/app/integrations/directory_service.py

      - name: Remove one-time patch workflow
        run: rm .github/workflows/patch-gbp-remove-from-client.yml

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/routes/integrations.py apps/api/app/integrations/directory_service.py apps/web/src/pages/integrations.astro apps/web/src/pages/gbp.astro apps/api/app/routes/gbp_mapping.py .github/workflows/patch-gbp-remove-from-client.yml
          git commit -m "Expose durable GBP removal from client workspaces"
          git push origin HEAD:fix/gbp-remove-from-client
