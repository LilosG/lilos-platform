name: Format content closure branch

on:
  push:
    branches:
      - release/content-workflow-closure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: release/content-workflow-closure

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.9.28'
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      - name: Apply repository formatters
        run: |
          npm run format:web
          uv run ruff format apps tests scripts migrations

      - name: Verify formatting is clean
        run: |
          npm run format:check:web
          uv run ruff format --check apps tests scripts migrations

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps tests scripts migrations
          git commit -m 'Apply repository formatters to Content closure'
          git push origin HEAD:release/content-workflow-closure
