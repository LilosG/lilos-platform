name: Normalize GBP mapping PR

on:
  push:
    branches:
      - fix/gbp-mapping-integrity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/gbp-mapping-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore intended page and apply exact formatter
        run: |
          git show cfacc9b8a4534977b596ed2a116f388524a8c522:apps/web/src/pages/integrations.astro > apps/web/src/pages/integrations.astro
          npx prettier --write apps/web/src/pages/integrations.astro
      - name: Commit normalized file
        run: |
          rm .github/workflows/format-gbp-mapping-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/integrations.astro .github/workflows/format-gbp-mapping-pr.yml
          git commit -m "Normalize integrations page with Prettier"
          git push origin HEAD:fix/gbp-mapping-integrity
