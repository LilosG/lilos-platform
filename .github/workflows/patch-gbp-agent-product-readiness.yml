name: Patch GBP agent product readiness

on:
  push:
    branches:
      - fix/gbp-agent-product-readiness
    paths:
      - .github/workflows/patch-gbp-agent-product-readiness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gbp-agent-product-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch shared product-agent handler
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/components/AppShell.astro")
          text = path.read_text()

          old_import = '''    fetchAgentLocationResolution,\n    isProductAgentWorkflow,\n    PRODUCT_AGENT_LABELS,'''
          new_import = '''    fetchAgentLocationResolution,\n    isProductAgentWorkflow,\n    productAgentWorkflowFromHref,\n    PRODUCT_AGENT_LABELS,'''
          if old_import not in text:
              raise SystemExit("AppShell product-agent import block not found")
          text = text.replace(old_import, new_import, 1)

          old_resolution = '''      const locationResult = await fetchAgentLocationResolution(\n        organizationId,\n        selectedPageLocationId(),\n      );'''
          new_resolution = '''      const locationResult = await fetchAgentLocationResolution(\n        organizationId,\n        workflow,\n        selectedPageLocationId(),\n      );'''
          if old_resolution not in text:
              raise SystemExit("AppShell location resolution call not found")
          text = text.replace(old_resolution, new_resolution, 1)

          old_none = '''        setProductAgentStatus(\n          "No active location is available for this organization.",\n          "danger",\n        );'''
          new_none = '''        setProductAgentStatus(\n          workflow === "agent.gbp"\n            ? "No confirmed Business Profile mapping is available for this organization."\n            : "No active location is available for this organization.",\n          "danger",\n        );'''
          if old_none not in text:
              raise SystemExit("AppShell no-location message not found")
          text = text.replace(old_none, new_none, 1)

          old_click = '''    const action = source.closest<HTMLElement>("[data-product-agent-workflow]");\n    if (!action) return;\n    const workflow = action.dataset.productAgentWorkflow;\n    if (!isProductAgentWorkflow(workflow)) return;'''
          new_click = '''    const action = source.closest<HTMLElement>(\n      "[data-product-agent-workflow], a[href]",\n    );\n    if (!action) return;\n    const dataWorkflow = action.dataset.productAgentWorkflow;\n    const workflow = isProductAgentWorkflow(dataWorkflow)\n      ? dataWorkflow\n      : productAgentWorkflowFromHref(action.getAttribute("href"));\n    if (!workflow) return;'''
          if old_click not in text:
              raise SystemExit("AppShell product-agent click handler not found")
          text = text.replace(old_click, new_click, 1)

          path.write_text(text)
          PY
      - name: Apply repository formatter
        run: npx prettier --write apps/web/src/components/AppShell.astro apps/web/src/lib/product-agent-action.ts apps/web/src/lib/product-agent-action.test.ts
      - name: Validate affected frontend contract
        run: |
          npm run format:check:web
          npm run lint:web
          npm run typecheck:web
          npm run test:web -- src/lib/product-agent-action.test.ts
      - name: Commit exact patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-gbp-agent-product-readiness.yml
          git add apps/web/src/components/AppShell.astro apps/web/src/lib/product-agent-action.ts apps/web/src/lib/product-agent-action.test.ts
          git commit -m "Run product agents from governed product context"
          git push origin HEAD:fix/gbp-agent-product-readiness
