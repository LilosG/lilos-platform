name: Patch GBP removal queues

on:
  push:
    branches:
      - fix/gbp-remove-from-client
    paths:
      - .github/workflows/patch-gbp-remove-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/gbp-remove-from-client

      - name: Patch archived filtering and operator label
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_archived_filter(path, function_name, connection_expression):
              file_path = Path(path)
              lines = file_path.read_text().splitlines(keepends=True)
              start = next((i for i, line in enumerate(lines) if function_name in line), None)
              if start is None:
                  raise SystemExit("function not found: " + function_name)
              end = next(
                  (i for i in range(start + 1, len(lines)) if lines[i].startswith("    async def ")),
                  len(lines),
              )
              section = lines[start:end]
              if any('GBPLocation.mapping_status != "archived"' in line for line in section):
                  return
              matches = [
                  i for i in range(start, end)
                  if lines[i].strip() == connection_expression
              ]
              if len(matches) != 1:
                  raise SystemExit("expected one connection predicate in " + function_name)
              index = matches[0]
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines.insert(index + 1, indent + 'GBPLocation.mapping_status != "archived",\n')
              file_path.write_text("".join(lines))

          insert_archived_filter(
              "apps/api/app/routes/integrations.py",
              "async def google_unmapped(",
              "GBPLocation.connection_id == connection.id,",
          )
          insert_archived_filter(
              "apps/api/app/integrations/directory_service.py",
              "async def _unmapped_count(",
              "GBPLocation.connection_id == connection_id,",
          )

          page = Path("apps/web/src/pages/integrations.astro")
          text = page.read_text()
          old_label = 'removeButton.textContent = "Remove mapping";'
          if text.count(old_label) != 1:
              raise SystemExit("expected one Remove mapping button label")
          text = text.replace(old_label, 'removeButton.textContent = "Remove from client";', 1)
          click_start = text.find('removeButton.addEventListener("click", () => {')
          click_end = text.find("            actions.append(removeButton);", click_start)
          if click_start < 0 or click_end < 0:
              raise SystemExit("remove action block not found")
          block = text[click_start:click_end]
          if block.count('"Remove mapping",') != 1:
              raise SystemExit("expected one Remove mapping confirmation label")
          block = block.replace('"Remove mapping",', '"Remove from client",', 1)
          page.write_text(text[:click_start] + block + text[click_end:])
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/patch-gbp-remove-v2.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/routes/integrations.py apps/api/app/integrations/directory_service.py apps/web/src/pages/integrations.astro .github/workflows/patch-gbp-remove-v2.yml
          git commit -m "Exclude archived GBP profiles from client queues"
          git push origin HEAD:fix/gbp-remove-from-client
