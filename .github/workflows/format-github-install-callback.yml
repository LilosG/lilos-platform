name: Format GitHub install callback patch

on:
  push:
    branches:
      - fix/github-app-install-callback

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/github-app-install-callback
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier output
        run: npx prettier --write apps/web/src/lib/github-app.ts apps/web/src/lib/github-app.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/github-app.ts apps/web/src/lib/github-app.test.ts
          git commit -m "Apply exact Prettier output to GitHub callback patch"
          git push origin HEAD:fix/github-app-install-callback
