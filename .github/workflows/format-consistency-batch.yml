name: Format consistency batch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format consistency batch
        run: npx prettier --write src/pages/automations.astro src/pages/integrations.astro
        working-directory: apps/web

      - name: Remove formatter workflow and commit exact output
        run: |
          rm .github/workflows/format-consistency-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/automations.astro apps/web/src/pages/integrations.astro .github/workflows/format-consistency-batch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format consistency batch"
          git push origin HEAD:main
