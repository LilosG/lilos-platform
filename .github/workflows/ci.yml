name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check:web

      - name: Lint
        run: npm run lint:web

      - name: Type check
        run: npm run typecheck:web

      - name: Test
        run: npm run test:web

      - name: Build
        run: npm run build:web

      - name: Browser and accessibility tests
        run: npm run check:browser

      - name: Dependency audit
        run: npm audit --audit-level=high

  python:
    name: Python validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lilos_test
          POSTGRES_PASSWORD: lilos_test
          POSTGRES_USER: lilos_test
        options: >-
          --health-cmd "pg_isready -U lilos_test -d lilos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      LILOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://lilos_test:lilos_test@127.0.0.1:5432/lilos_test
      LILOS_TEST_DATABASE_URL: postgresql+asyncpg://lilos_test:lilos_test@127.0.0.1:5432/lilos_test
      LILOS_RESTORE_DATABASE_URL: postgresql+asyncpg://lilos_test:lilos_test@127.0.0.1:5432/lilos_restore_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check apps tests scripts migrations

      - name: Lint
        run: uv run ruff check apps tests scripts migrations

      - name: Type check
        run: uv run mypy apps tests scripts migrations

      - name: Test
        run: uv run pytest

      - name: Dependency audit
        run: uv run pip-audit

      - name: Validate migrations
        run: |
          uv run alembic upgrade head

      - name: Verify synthetic backup restore
        run: |
          PG_CONTAINER_ID=$(docker ps --filter "ancestor=postgres:17" --format "{{.ID}}")
          test -n "$PG_CONTAINER_ID"
          docker exec -e PGPASSWORD=lilos_test "$PG_CONTAINER_ID" pg_dump -h 127.0.0.1 -U lilos_test -d lilos_test -Fc -f /tmp/lilos-test.backup
          docker exec -e PGPASSWORD=lilos_test "$PG_CONTAINER_ID" createdb -h 127.0.0.1 -U lilos_test lilos_restore_test
          docker exec -e PGPASSWORD=lilos_test "$PG_CONTAINER_ID" pg_restore -h 127.0.0.1 -U lilos_test -d lilos_restore_test /tmp/lilos-test.backup
          uv run python scripts/verify_restored_database.py
          docker exec -e PGPASSWORD=lilos_test "$PG_CONTAINER_ID" dropdb -h 127.0.0.1 -U lilos_test lilos_restore_test
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Verify environment example
        run: uv run python scripts/check_secrets.py

      - name: Verify release acceptance package
        run: uv run python scripts/release_gate.py
