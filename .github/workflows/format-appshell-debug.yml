name: Format AppShell exact output

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format AppShell and print exact output
        run: |
          npx prettier --config apps/web/prettier.config.mjs --write apps/web/src/components/AppShell.astro
          printf '%s\n' '---BEGIN_FORMATTED_APPSHELL---'
          cat apps/web/src/components/AppShell.astro
          printf '%s\n' '---END_FORMATTED_APPSHELL---'
