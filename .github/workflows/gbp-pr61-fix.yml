name: PR61 Fix Validation

on:
  push:
    branches:
      - fix/gbp-review-post-operational-closure

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/gbp-review-post-operational-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked
      - name: Fix the four PR 61 lint violations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/app/products/gbp/post_generation.py")
          text = path.read_text()
          replacements = {
              '                        "The existing generated post is missing its required review, CTA, or image binding.",':
              '                        (\n                            "The existing generated post is missing its required review, CTA, "\n                            "or image binding."\n                        ),',
              '                    "The selected customer review is unavailable in this organization and location.",':
              '                    (\n                        "The selected customer review is unavailable in this organization "\n                        "and location."\n                    ),',
              '            "No unused eligible four- or five-star customer review is available for GBP post generation.",':
              '            (\n                "No unused eligible four- or five-star customer review is available for "\n                "GBP post generation."\n            ),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected post_generation source not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("apps/api/app/products/gbp/proposal_enrichment.py")
          text = path.read_text()
          old = '                "No client-owned website page with positive relevance could be resolved for the GBP post.",'
          new = '                (\n                    "No client-owned website page with positive relevance could be resolved "\n                    "for the GBP post."\n                ),'
          if old not in text:
              raise SystemExit("expected proposal_enrichment source not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: uv run ruff format apps tests scripts migrations
      - name: Lint
        run: uv run ruff check apps tests scripts migrations
      - name: Type check
        run: uv run mypy apps tests scripts migrations
      - name: Focused GBP tests
        run: >-
          uv run pytest
          tests/python/gbp/test_post_generation_helpers.py
          tests/python/gbp/test_proposal_enrichment.py
          tests/python/workflows/test_gbp_generation_delivery_invariant.py
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/products/gbp/post_generation.py apps/api/app/products/gbp/proposal_enrichment.py
          git commit -m "Fix GBP review post validation"
          git push origin HEAD:fix/gbp-review-post-operational-closure
