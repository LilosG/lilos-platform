name: Format Growth Queue

on:
  push:
    branches:
      - ui/growth-queue-operator-experience

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ui/growth-queue-operator-experience

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository Prettier output
        run: npx prettier --write apps/web/src/pages/growth.astro

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-growth-queue.yml

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/growth.astro .github/workflows/format-growth-queue.yml
          git commit -m "Apply exact Prettier output to Growth Queue"
          git push origin HEAD:ui/growth-queue-operator-experience
