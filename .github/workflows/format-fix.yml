name: Format Fix

on:
  push:
    branches:
      - fix/gbp-review-post-operational-closure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/gbp-review-post-operational-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format apps tests scripts migrations
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps tests scripts migrations
          git commit -m "Format Python changes"
          git push origin HEAD:fix/gbp-review-post-operational-closure
