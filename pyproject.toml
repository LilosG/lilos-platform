[project]
name = "lilos-platform"
version = "0.1.0"
description = "LILOs modular-monolith application foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "croniter>=6.0,<7",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "check-jsonschema>=0.35,<1",
    "mypy>=1.17,<2",
    "pip-audit>=2.10.1",
    "pytest>=8.4,<10",
    "pyyaml>=6.0,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
    "types-croniter>=6.0,<7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "tests", "scripts", "migrations"]
exclude = ["apps/web"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: requires an isolated PostgreSQL test database",
]
testpaths = ["tests/python"]
pythonpath = ["."]
